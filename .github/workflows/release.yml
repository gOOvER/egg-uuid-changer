name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create plugin ZIP
        run: |
          mkdir -p build/egg-uuid-changer
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' . build/egg-uuid-changer/
          cd build
          zip -r ../egg-uuid-changer.zip egg-uuid-changer
          cp ../egg-uuid-changer.zip ../egg-uuid-changer-v${{ steps.get_version.outputs.VERSION }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            egg-uuid-changer.zip
            egg-uuid-changer-v${{ steps.get_version.outputs.VERSION }}.zip
          body: |
            ## Installation

            Download `egg-uuid-changer.zip` below and import it via:
            **Admin Area → Plugins → Import**

            Or install manually:
            ```bash
            cd /var/www/pelican/plugins
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/egg-uuid-changer.zip
            unzip egg-uuid-changer.zip
            cd /var/www/pelican
            php artisan p:plugin:install egg-uuid-changer
            php artisan optimize:clear
            ```

            ## Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
